[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpui-agent"
version = "0.1.0"
description = "Bounded Jev-driven native GPUI review over a versioned JSON protocol"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []
readme = "README.md"

[project.urls]
Repository = "https://github.com/stolinski/gpui-agent"

[project.scripts]
gpui-agent = "gpui_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
